<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rezepte · Simmer</title>
  <link rel="stylesheet" href="/static/style.css?v=3">
  <link rel="icon" href="/static/favicon.ico?v=1" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v=1">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v=1">
</head>
<body>
  <header class="site-header"><a class="logo" href="/">simmer<span>.</span></a></header>
  <main class="home">
    <div class="home-toolbar">
      <h1>Rezepte</h1>
      <a class="button" href="/recipes/new">Rezept manuell erfassen</a>
    </div>
    <form id="import-form" class="import-panel">
      <label for="url">Rezeptlink importieren</label>
      <div class="input-row">
        <input id="url" type="url" placeholder="https://…" required>
        <button type="submit">Rezept importieren</button>
      </div>
      <p id="form-error" class="error" role="alert"></p>
    </form>
    <section class="collection" aria-label="Gespeicherte Rezepte">
      <div id="recipe-list" class="recipe-grid"></div>
    </section>
  </main>
  <script src="/static/app.js?v=2" defer></script>
  <script src="/static/pull-refresh.js" defer></script>
</body>
</html>
